{{- /*
The master key that seals the secrets Ortus keeps in its database (OIDC
signing key, providers' client secrets, directory password, authenticator
secrets). Every workload must use the same key, so it lives here, made once
and kept: losing it makes those secrets unreadable, and backups never carry
it. Keep a copy somewhere safe.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "ortus.secretsSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ortus.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  key: {{ index $existing.data "key" }}
  {{- else }}
  key: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
