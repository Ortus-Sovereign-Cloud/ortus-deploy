{{- $root := . -}}
{{- range $role := list "web" "worker" "mail" "media" }}
{{- $spec := index $root.Values.roles $role }}
{{- if or (eq $role "web") (eq $role "worker") $spec.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ortus.name" $root }}-{{ $role }}
  labels:
    {{- include "ortus.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ $spec.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        {{- include "ortus.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
    spec:
      {{- include "ortus.podSpecCommon" $root | nindent 6 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: ortus
          image: {{ include "ortus.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: ["serve"]
          env:
            - name: ORTUS_ROLES
              value: {{ $role }}
            {{- include "ortus.env" $root | nindent 12 }}
          {{- if eq $role "web" }}
            - name: ORTUS_WEB_IP
              value: "0.0.0.0"
            - name: ORTUS_WEB_PORT
              value: "7878"
            {{- if $root.Values.dav.enabled }}
            - name: ORTUS_DAV_LISTEN
              value: "0.0.0.0:{{ $root.Values.dav.port }}"
            {{- end }}
          ports:
            - name: http
              containerPort: 7878
            {{- if $root.Values.dav.enabled }}
            - name: dav
              containerPort: {{ $root.Values.dav.port }}
            {{- end }}
          # Starting includes bringing the database up to date, which can
          # take minutes after an upgrade.
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 2
            failureThreshold: 600
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          {{- end }}
          {{- if eq $role "mail" }}
            - name: ORTUS_SMTP_LISTEN
              value: "0.0.0.0:2525"
            - name: ORTUS_SUBMISSION_LISTEN
              value: "0.0.0.0:2587"
            - name: ORTUS_SUBMISSIONS_LISTEN
              value: "0.0.0.0:2465"
            - name: ORTUS_IMAP_LISTEN
              value: "0.0.0.0:2143"
            - name: ORTUS_IMAPS_LISTEN
              value: "0.0.0.0:2993"
            {{- with $spec.hostname }}
            - name: ORTUS_MAIL_HOSTNAME
              value: {{ . | quote }}
            {{- end }}
            {{- if $spec.tlsSecret }}
            - name: ORTUS_MAIL_TLS_CERT
              value: /tls/tls.crt
            - name: ORTUS_MAIL_TLS_KEY
              value: /tls/tls.key
            {{- end }}
          # Up when it takes mail.
          readinessProbe:
            tcpSocket: {port: smtp}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: smtp}
            periodSeconds: 20
            failureThreshold: 6
          ports:
            - {name: smtp, containerPort: 2525}
            - {name: submission, containerPort: 2587}
            - {name: imap, containerPort: 2143}
            {{- if $spec.tlsSecret }}
            - {name: submissions, containerPort: 2465}
            - {name: imaps, containerPort: 2993}
            {{- end }}
          {{- end }}
          {{- if eq $role "media" }}
            - name: ORTUS_MEDIA_LISTEN
              value: "0.0.0.0:{{ $spec.port }}"
            {{- with $spec.publicAddress }}
            - name: ORTUS_MEDIA_PUBLIC
              value: {{ . | quote }}
            {{- end }}
            # Signalling on the pod's own address, which the web pods reach
            # (not 127.0.0.1, which is each pod's own).
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: ORTUS_MEDIA_SIGNAL_LISTEN
              value: "0.0.0.0:{{ $spec.signalPort }}"
            - name: ORTUS_MEDIA_SIGNAL_URL
              value: "http://$(POD_IP):{{ $spec.signalPort }}"
            {{- if $spec.turn.enabled }}
            - name: ORTUS_TURN_LISTEN
              value: "0.0.0.0:3478"
            - name: ORTUS_TURN_URL
              value: {{ required "roles.media.turn.url is required when the relay is on" $spec.turn.url | quote }}
            {{- end }}
          readinessProbe:
            tcpSocket: {port: signal}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: signal}
            periodSeconds: 20
            failureThreshold: 6
          ports:
            - {name: media-udp, containerPort: {{ $spec.port }}, protocol: UDP}
            - {name: media-tcp, containerPort: {{ $spec.port }}, protocol: TCP}
            - {name: signal, containerPort: {{ $spec.signalPort }}, protocol: TCP}
            {{- if $spec.turn.enabled }}
            - {name: turn, containerPort: 3478, protocol: TCP}
            {{- end }}
          {{- end }}
          securityContext: {{ toYaml $root.Values.securityContext | nindent 12 }}
          resources: {{ toYaml $spec.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if and (eq $role "mail") $spec.tlsSecret }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        {{- if and (eq $role "mail") $spec.tlsSecret }}
        - name: tls
          secret:
            secretName: {{ $spec.tlsSecret }}
        {{- end }}
{{- end }}
{{- end }}
{{- if .Values.roles.mail.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ortus.name" . }}-mail
  labels:
    {{- include "ortus.labels" . | nindent 4 }}
    app.kubernetes.io/component: mail
  {{- with .Values.roles.mail.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.roles.mail.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mail
  ports:
    - {name: smtp, port: 25, targetPort: smtp}
    - {name: submission, port: 587, targetPort: submission}
    - {name: imap, port: 143, targetPort: imap}
    {{- if .Values.roles.mail.tlsSecret }}
    - {name: submissions, port: 465, targetPort: submissions}
    - {name: imaps, port: 993, targetPort: imaps}
    {{- end }}
{{- end }}
{{- if .Values.roles.media.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ortus.name" . }}-media
  labels:
    {{- include "ortus.labels" . | nindent 4 }}
    app.kubernetes.io/component: media
  {{- with .Values.roles.media.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.roles.media.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: media
  ports:
    - {name: media-udp, port: {{ .Values.roles.media.port }}, targetPort: media-udp, protocol: UDP}
    - {name: media-tcp, port: {{ .Values.roles.media.port }}, targetPort: media-tcp, protocol: TCP}
{{- if .Values.roles.media.turn.enabled }}
---
# The TURN relay, for the TLS proxy in front (plain TCP; the proxy decrypts).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ortus.name" . }}-turn
  labels:
    {{- include "ortus.labels" . | nindent 4 }}
    app.kubernetes.io/component: media
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: media
  ports:
    - {name: turn, port: 3478, targetPort: turn, protocol: TCP}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ortus.name" . }}-web
  labels:
    {{- include "ortus.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
    {{- if .Values.dav.enabled }}
    - name: dav
      port: {{ .Values.dav.port }}
      targetPort: dav
    {{- end }}
{{- if .Values.web.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ortus.name" . }}-web
  labels:
    {{- include "ortus.labels" . | nindent 4 }}
  {{- with .Values.web.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.web.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.web.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.web.ingress.host | quote }}]
      secretName: {{ .Values.web.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.web.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ortus.name" . }}-web
                port:
                  name: http
{{- end }}
