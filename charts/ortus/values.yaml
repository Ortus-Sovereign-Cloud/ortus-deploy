# The Ortus program. Every role runs the same image with ORTUS_ROLES set.
image:
  repository: ghcr.io/ortus-sovereign-cloud/ortus
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The address people reach the installation at, like
# https://ortus.example.org (links in mail, passkeys, calendar invitations).
publicUrl: ""

# More settings for every Ortus container, as ORTUS_* variables:
#   extraEnv: [{name: ORTUS_TRUSTED_PROXIES, value: "10.0.0.0/8"}]
extraEnv: []

# One workload per role.
roles:
  web:
    replicas: 2
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}
  worker:
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 512Mi}
  # Mail: SMTP (25), submission (587, and 465 with TLS), IMAP (143, and 993
  # with TLS). The pod listens on high ports (no privileges); the Service
  # gives the standard ones. Mail from the internet needs port 25 on a
  # public address: a LoadBalancer, or your own routing to the Service.
  mail:
    enabled: true
    replicas: 1
    # The name other servers know the mail host by (its MX and certificate).
    hostname: ""
    # A kubernetes.io/tls secret for that name: opens 465 and 993, and
    # STARTTLS on the others.
    tlsSecret: ""
    service:
      type: LoadBalancer
      annotations: {}
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 512Mi}
  media:
    enabled: true
    # Call media (UDP, with a TCP fallback on the same port). People in a
    # call reach it at publicAddress (ip:port of the Service from outside).
    port: 40000
    publicAddress: ""
    service:
      type: LoadBalancer
      annotations: {}
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 512Mi}

web:
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    host: ortus.example.org
    annotations: {}
    # Name of a TLS secret for the host; empty for none.
    tlsSecret: ""

# The database: PostgreSQL. `bundled` makes a CloudNativePG cluster (the
# CloudNativePG operator must be installed in the cluster first);
# `external` uses one you run.
database:
  mode: bundled
  bundled:
    instances: 1
    storage: 10Gi
    storageClass: ""
  external:
    # A secret in this namespace holding the connection URL
    # (postgres://user:password@host:5432/db).
    existingSecret: ""
    key: url
  maxConnections: 16

# The master key that seals the secrets kept in the database. The chart
# makes one and keeps it (helm.sh/resource-policy: keep). With GitOps tools
# that render without a cluster, name a secret you made (key `key`: 32
# random bytes, base64, as `openssl rand -base64 32` prints): otherwise a
# new key would be made on every sync and Ortus would refuse to start.
# To rotate: put a new key first ("new,old" in the secret), restart every
# workload (`kubectl rollout restart deployment -l app.kubernetes.io/instance=<release>`);
# the first to start re-seals everything under the new key. Keep the old
# key in the list for as long as you keep backups made before.
secrets:
  existingSecret: ""

# File contents: S3. `bundled` runs RustFS in the cluster; `external` uses
# a store you run.
files:
  mode: bundled
  bucket: ortus
  region: us-east-1
  bundled:
    # With GitOps tools that render the chart without a cluster (Argo CD,
    # Flux), name a secret you made (keys access_key, secret_key): the
    # chart cannot see an existing one there and would make new keys on
    # every sync.
    existingSecret: ""
    image:
      repository: rustfs/rustfs
      tag: "1.0.6"
    storage: 20Gi
    storageClass: ""
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 1Gi}
  external:
    endpoint: ""
    # A secret in this namespace with keys access_key and secret_key.
    existingSecret: ""
  # Creates the bucket after install and upgrade when it is missing.
  bucketJob:
    image:
      repository: amazon/aws-cli
      tag: "2.31.39"

# A backup of the database and files, as `ortus backup`, onto a volume.
backup:
  enabled: true
  schedule: "15 3 * * *"
  # Each backup is a full copy of the database and every file: size the
  # volume for keep + 1 copies.
  keep: 3
  storage: 50Gi
  storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
